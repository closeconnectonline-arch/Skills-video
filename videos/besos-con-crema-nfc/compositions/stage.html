  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // Cámara: escala desde la esquina superior izquierda. near = primer plano (más paralaje), far = pared (menos).
      const CAM = {
        hero:  { scale: 1.3, x: 111, y: -248 },
        wide:  { scale: 1.0, x: 0,   y: 0 },
        phone: { scale: 1.3, x: -653, y: -303 },
        end:   { scale: 1.04, x: -10, y: -30 },
      };
      const par = (s, k) => ({ scale: 1 + (s.scale - 1) * k, x: s.x * k, y: s.y * k });
      function camTo(state, at, dur, ease) {
        const s = CAM[state];
        tl.to("#cam", { ...s, duration: dur, ease }, at);
        tl.to("#near", { ...par(s, 1.35), duration: dur, ease }, at);
        tl.to("#far", { ...par(s, 0.55), duration: dur, ease }, at);
      }
      tl.set("#cam", CAM.hero, 0); tl.set("#near", par(CAM.hero, 1.35), 0); tl.set("#far", par(CAM.hero, 0.55), 0);
      // Leve dolly durante el hero para que el plano viva.
      tl.to("#cam", { scale: 1.33, x: 101, y: -277, duration: 2.6, ease: "none" }, 0);
      tl.to("#near", { ...par({ scale: 1.33, x: 101, y: -277 }, 1.35), duration: 2.6, ease: "none" }, 0);

      // 1 · Barrido de luz por el acrílico
      tl.set("#sweep", { xPercent: -120 }, 0);
      tl.to("#sweep", { xPercent: 200, duration: 1.5, ease: "power2.inOut" }, 0.25);

      // 2 · Abre a plano general y entra el iPhone
      tl.set("#phw", { x: 760, rotation: 4, filter: "blur(0px)" }, 0);
      camTo("wide", 2.55, 1.0, "power2.inOut");
      tl.fromTo("#phw", { x: 760, rotation: 4 }, { x: 0, rotation: -8, duration: 0.9, ease: "expo.out" }, 2.7);
      tl.fromTo("#phw", { filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.45, ease: "power2.out" }, 2.75);

      // Ondas NFC: tres pulsos del módulo al teléfono
      function waves(at, n, peak) {
        for (let k = 0; k < n; k++) {
          ["#w1", "#w2", "#w3"].forEach((w, i) => {
            const t = at + k * 0.55 + i * 0.12;
            tl.fromTo(w, { opacity: 0 }, { opacity: peak, duration: 0.16, ease: "power1.out" }, t);
            tl.to(w, { opacity: 0, duration: 0.3, ease: "power1.in" }, t + 0.24);
          });
        }
      }
      tl.set(["#w1", "#w2", "#w3"], { opacity: 0 }, 0);
      waves(3.35, 3, 0.95);

      // 3 · Se enciende la pantalla: notificación NFC → toque → loader → landing
      tl.set(["#loader", "#toast-wa", "#toast-ig", "#toast-fb", "#finger", "#banner"], { opacity: 0 }, 0);
      tl.fromTo("#lpc", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.fromTo("#banner", { opacity: 0, y: -90 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out" }, 4.45);
      function tap(x, y, at, pressSel) {
        tl.fromTo("#finger", { x, y: y + 60, opacity: 0, scale: 1.25 }, { y, opacity: 1, scale: 1, duration: 0.28, ease: "power3.out" }, at - 0.3);
        tl.to("#finger", { scale: 0.82, duration: 0.12, ease: "power2.in" }, at);
        tl.to("#finger", { scale: 1, duration: 0.18, ease: "power2.out" }, at + 0.12);
        tl.to("#finger", { opacity: 0, duration: 0.25, ease: "power1.in" }, at + 0.42);
        if (pressSel) {
          tl.to(pressSel + " .press", { opacity: 1, duration: 0.1, ease: "power1.out" }, at);
          tl.to(pressSel, { scale: 0.975, duration: 0.12, ease: "power2.in" }, at);
          tl.to(pressSel, { scale: 1, duration: 0.2, ease: "power2.out" }, at + 0.14);
          tl.to(pressSel + " .press", { opacity: 0, duration: 0.25, ease: "power1.in" }, at + 0.2);
          tl.fromTo(pressSel + " .rip", { scale: 0.2, opacity: 0.9 }, { scale: 3.4, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, at + 0.02);
        }
      }
      tl.set(".rip", { opacity: 0, scale: 0.2 }, 0);
      tap(196, 100, 5.15, null);
      tl.to("#banner", { scale: 0.96, duration: 0.1 }, 5.15);
      tl.to("#banner", { opacity: 0, y: -40, duration: 0.25, ease: "power3.in" }, 5.3);
      tl.to("#loader", { opacity: 1, duration: 0.2 }, 5.32);
      tl.to("#lpc", { opacity: 1, duration: 0.01 }, 5.5);
      tl.fromTo("#ld-heart", { scale: 0.86, transformOrigin: "50% 50%" }, { scale: 1.14, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 3 }, 5.4);
      tl.fromTo("#ld-star", { rotation: 0, scale: 0.8, transformOrigin: "50% 50%" }, { rotation: 20, scale: 1.15, duration: 0.6, ease: "sine.inOut" }, 5.4);
      tl.to("#loader", { opacity: 0, duration: 0.3, ease: "power1.out" }, 6.0);
      tl.fromTo("#lp-logo", { scale: 0.92, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "expo.out" }, 6.0);
      tl.fromTo("#lp-desc", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.15);
      ["#btn-wa", "#btn-ig", "#btn-fb"].forEach((b, i) => tl.fromTo(b, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 6.1 + i * 0.07));

      // 4 · Empuje de cámara al teléfono
      camTo("phone", 6.65, 1.0, "power2.inOut");
      tl.to("#phw", { rotation: 0, duration: 1.0, ease: "power2.inOut" }, 6.65);
      tl.fromTo("#modw, #base, #nfc", { filter: "blur(0px)" }, { filter: "blur(7px)", duration: 1.0, ease: "power2.inOut" }, 6.65);

      // 5 · Los tres taps: botón → onda → insignia de la red → aviso "Abriendo…"
      const TAPS = [
        { btn: "#btn-wa", y: 385, at: 7.95, bdg: "#bdg-wa", toast: "#toast-wa", sy: 952 },
        { btn: "#btn-ig", y: 455, at: 9.95, bdg: "#bdg-ig", toast: "#toast-ig", sy: 1034 },
        { btn: "#btn-fb", y: 525, at: 11.95, bdg: "#bdg-fb", toast: "#toast-fb", sy: 1115 },
      ];
      TAPS.forEach((t) => {
        tap(250, t.y, t.at, t.btn);
        tl.set(t.bdg, { top: t.sy }, 0);
        tl.fromTo("#lk", { y: t.sy - 2, scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.3, ease: "expo.out" }, t.at + 0.08);
        tl.to("#lk", { opacity: 0, duration: 0.3 }, t.at + 0.6);
        tl.fromTo(t.bdg, { opacity: 0, x: -150, scale: 0.4 }, { opacity: 1, x: 0, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, t.at + 0.12);
        tl.fromTo(t.bdg + " .t", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, t.at + 0.4);
        tl.fromTo(t.toast, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, t.at + 0.3);
        tl.to(t.toast, { opacity: 0, y: 10, duration: 0.25, ease: "power3.in" }, t.at + 1.45);
        tl.to(t.bdg, { opacity: 0, scale: 0.85, duration: 0.3, ease: "power3.in" }, t.at + 1.55);
      });

      // 6 · Regreso al plano general
      camTo("wide", 13.75, 1.1, "power2.inOut");
      tl.to("#phw", { rotation: -8, duration: 1.1, ease: "power2.inOut" }, 13.75);
      tl.to("#modw, #base, #nfc", { filter: "blur(0px)", duration: 1.1, ease: "power2.inOut" }, 13.75);
      tl.set("#sweep", { xPercent: -120 }, 14.5);
      tl.to("#sweep", { xPercent: 200, duration: 1.4, ease: "power2.inOut" }, 14.6);

      // 7 · Cierre
      camTo("end", 16.3, 2.6, "sine.inOut");
      waves(16.5, 3, 0.6);

      window.__timelines["stage"] = tl;
    })();
  </script>
