<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texto giratorio · demo</title>
<link rel="stylesheet" href="style.css">
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .demo { min-height: 50vh; display: grid; place-items: center; padding: 40px 20px; text-align: center; }
  .demo--claro { background: #fff; color: #111; }
  .demo--oscuro { background: #0a0a0a; color: #fff; }
  .titulo { margin: 0; font-size: clamp(2rem, 7vw, 4.5rem); font-weight: 700; line-height: 1.3; }
</style>
</head>
<body>
  <!-- El ejemplo original: solo la caja con las palabras, en claro y en oscuro -->
  <section class="demo demo--claro">
    <span class="titulo"><span class="texto-giratorio" data-texto-giratorio data-palabras="better|modern|Tyler Durden|awesome">better</span></span>
  </section>
  <section class="demo demo--oscuro">
    <p class="titulo">Haz tu web <span class="texto-giratorio texto-giratorio--oscuro" data-texto-giratorio data-palabras="mejor|moderna|rápida|increíble">mejor</span></p>
  </section>
  <script src="texto-giratorio.js"></script>
</body>
</html>
