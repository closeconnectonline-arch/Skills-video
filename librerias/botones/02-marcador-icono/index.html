<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Botón marcador con ícono</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Solo para la demo: centra el componente en la página */
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; font-family: system-ui, sans-serif; background: #1b1b1b; }
  </style>
</head>
<body>
  <button class="bookmarkBtn">
    <span class="IconContainer">
      <svg class="icon" viewBox="0 0 16 16" width="14" height="14" fill="white" aria-hidden="true"><path d="M2 2v13.5a.5.5 0 0 0 .74.439L8 13.069l5.26 2.87A.5.5 0 0 0 14 15.5V2a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2"/></svg>
    </span>
    <p class="text">Guardar</p>
  </button>
</body>
</html>
