<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dj carrusel · ejemplo Untitled</title>
  <!-- Motor: no lo edites; cambia el aspecto con las variables de abajo -->
  <link rel="stylesheet" href="../motor/dj-carrusel.css">
  <style>
    html, body { margin: 0; background: #000; }
    /* Personalización (opcional): descomenta y cambia
    .djc {
      --djc-fondo: #000000;
      --djc-texto: #ffffff;
      --djc-panel: #0b0b0c;
      --djc-fuente: system-ui, sans-serif;
      --djc-swap: 0.5s;
    } */
  </style>
</head>
<body>
  <!-- ============ DJ CARRUSEL ============
       Opciones: data-espaciado, data-desplazamiento, data-panel, data-escalonado (ver motor/dj-carrusel.js) -->
  <section class="djc" data-dj-carrusel aria-label="Galería">

    <!-- [EDITAR] Titular: escribe el mismo texto en las dos líneas -->
    <h1 class="djc__title djc__title--fade" aria-hidden="true">Inspirado por los pros. Hecho para ti.</h1>
    <h1 class="djc__title djc__title--solid">Inspirado por los pros. Hecho para ti.</h1>

    <div class="djc__stage">
      <div class="djc__deck-wrap">
        <div class="djc__deck"></div>

        <!-- Panel de información (no editar: se llena con los datos) -->
        <aside class="djc__panel" aria-live="polite" aria-hidden="true">
          <div class="djc__panel-body">
            <div class="djc__panel-top">
              <span class="djc__count">01 / 06</span>
              <button class="djc__close" type="button" aria-label="Cerrar">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11"/></svg>
              </button>
            </div>
            <figure class="djc__photo"><img alt=""></figure>
            <h2 class="djc__name"></h2>
            <p class="djc__desc"></p>
            <dl class="djc__meta"></dl>
            <div class="djc__nav">
              <button type="button" data-djc-prev>← Anterior</button>
              <button type="button" data-djc-next>Siguiente →</button>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <!-- [EDITAR] Indicación (puedes borrarla) -->
    <p class="djc__hint">Pasa el mouse por las tarjetas · haz clic para ver su información</p>

    <!-- Ejemplo con las fotos de la sesión Untitled (las imágenes viven en librerias/tarjetas/01-panel-fey/img/).
         [EDITAR] Fotos. 1ª = foto de fondo · última = tarjeta del frente (siempre a color).

  </section>

  <script src="../motor/dj-carrusel.js"></script>
